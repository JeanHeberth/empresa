spring:
  application:
    name: empresa

  datasource:
    url: jdbc:mysql://localhost:3306/empresa?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
      dialect: org.hibernate.dialect.MySQL8Dialect

server:
  port: 8089

jackson:
  date-format: yyyy-MM-dd
  time-zone: UTC
